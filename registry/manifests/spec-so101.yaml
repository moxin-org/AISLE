# The shipping SO-101 SPEC-VENDOR-NODE-V1 vendor node (dorarobotics/so-arm101-dora-node)
# with its `aisle` backend, as an ADR-30 lockstep participant: SPEC verbs in,
# TC-5 joint/gripper commands out through budget-guard. Clock = turn sim time.
id: spec-so101
kind: node
provides: [spec_vendor_node]
requires: []
inputs:
  cmd_request: {schema: json_utf8, rate_hz: 5}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  cmd_response: {schema: json_utf8, latency_class: best_effort}
  capabilities: {schema: json_utf8, latency_class: best_effort}
  state: {schema: json_utf8, latency_class: best_effort}
  safety_event: {schema: json_utf8, latency_class: best_effort}
  joint_cmd: {schema: jointvec_f32, latency_class: soft_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: soft_rt}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [so101]
  gripper: parallel
safety_class: motion
eval:
  suite: tests/unit/test_spec_so101.py (adapter contract with the vendor package loaded; ADR-30 sim-time clock)
  pass_rate: 1.0
  last_run: '2026-11-23'
origin: agent-authored
source: src/aisle/nodes/spec_so101.py
