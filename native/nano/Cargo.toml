[package]
name = "aisle-nano"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dora-node-api = { version = "=1.0.1", default-features = false }
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
urdf-rs = "0.9"
libc = "0.2"
