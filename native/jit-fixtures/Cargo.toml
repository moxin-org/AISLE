[package]
name = "aisle-jit-fixtures"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
zenoh-shm-test = ["dep:zenoh-shm"]

[patch.crates-io]
zenoh-protocol = { path = "../compat/zenoh-protocol" }
static_init = { path = "../compat/static_init" }
psm = { path = "../compat/psm" }

[dependencies]
zenoh-protocol = "=1.9.0"
static_init = "=1.0.4"
json5 = "=0.4.1"
serde_json = "1"
stacker = "=0.1.25"
zenoh-shm = { version = "=1.9.0", features = ["test"], optional = true }

[[bin]]
name = "static-init-exit"
path = "src/static_init_exit.rs"

[[bin]]
name = "json5-stack"
path = "src/json5_stack.rs"

[[bin]]
name = "zenoh-shm-exit"
path = "src/zenoh_shm_exit.rs"
required-features = ["zenoh-shm-test"]

[[test]]
name = "wire-expr"
path = "src/wire_expr.rs"
